    <!-- Count-up, Reveal on-scroll, Parallax background -->
    <script>
    // ===== Reveal on scroll (fade-in + translate) =====
    const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
        if (e.isIntersecting) {
            e.target.classList.remove('opacity-0','translate-y-6');
            e.target.classList.add('opacity-100','translate-y-0');
            io.unobserve(e.target);
        }
        });
    }, { root: null, threshold: 0.2 });

    document.querySelectorAll('#quick-facts .reveal').forEach(el => io.observe(el));

    // ===== Count-up numbers when visible =====
    function animateCount(el, to, duration = 1200) {
        const start = performance.now();
        function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const val = Math.floor(to * (t < 1 ? (1 - Math.pow(1 - t, 3)) : 1)); // easeOutCubic
        el.textContent = val.toLocaleString('en-US');
        if (t < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    }

    const factsObserver = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
        if (e.isIntersecting) {
            const box = e.target;
            const to = parseInt(box.dataset.to, 10) || 0;
            const suffix = (box.dataset.suffix || '').trim();
            const num = box.querySelector('.count');
            const suf = box.querySelector('.suffix');
            if (suf && suffix) suf.textContent = suffix;
            animateCount(num, to, 1200);
            factsObserver.unobserve(box);
        }
        });
    }, { threshold: 0.5 });

    document.querySelectorAll('#quick-facts .fact').forEach(el => factsObserver.observe(el));

    // ===== Parallax background for the section =====
    (function setupFactsParallax() {
        const section = document.getElementById('quick-facts');
        const bg = document.getElementById('factsBg');
        let ticking = false;

        function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
            const rect = section.getBoundingClientRect();
            // progress 0..1 saat section terlihat
            const vh = window.innerHeight || 1;
            const visible = Math.max(0, Math.min(rect.bottom, vh) - Math.max(rect.top, 0));
            const t = visible / Math.min(vh, rect.height || vh);
            // parallax: gerakkan gambar sedikit (20px) sesuai posisi section
            const offset = -rect.top * 0.5; // 0.2 = kecepatan parallax
            bg.style.transform = `translateY(${offset}px)`;
            ticking = false;
        });
        }

        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
    })();
    </script>

    <!-- Slideshow About Us -->
    <script>
        const slides = document.querySelectorAll('#slides .slide');
        const counter = document.getElementById('counter');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const current = document.getElementById('current');
        const totalEl = document.querySelector('#counter span:last-child');

        const total = slides.length;
        totalEl.textContent = `/${String(total).padStart(2,'0')}`;

        function showSlide(i) {
        slides.forEach((s, idx) => {
            s.style.opacity = idx === i ? '1' : '0';
        });
        current.textContent = String(i+1).padStart(2,'0');
        index = i;
        }

        function nextSlide() {
            showSlide((index + 1) % total);
        }
        function prevSlide() {
            showSlide((index - 1 + total) % total);
        }

        // Autoplay
        function startTimer() {
            timer = setInterval(nextSlide, 5000);
        }
        function resetTimer() {
            clearInterval(timer);
            startTimer();
        }

        nextBtn.addEventListener('click', () => { nextSlide(); resetTimer(); });
        prevBtn.addEventListener('click', () => { prevSlide(); resetTimer(); });

        // Init
        showSlide(0);
        startTimer();
    </script>

    <script>
  // Parallax horizontal mengikuti scroll (maju mundur)
  (() => {
    const section = document.getElementById('facilities');
    const items = Array.from(section.querySelectorAll('.fac-item img'));
    let ticking = false;

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    }

    function update() {
      ticking = false;

      const vh = window.innerHeight || 1;
      const rect = section.getBoundingClientRect();

      // progress 0..1 selama section terlihat di viewport
      // (0 saat mulai masuk, 1 saat keluar)
      const total = rect.height + vh;
      const seen = vh - rect.top;              // kira-kira berapa bagian yang dilalui
      const t = clamp(seen / total, 0, 1);     // 0..1

      // amplitude: lebih kecil di mobile
      const isMobile = window.matchMedia('(max-width: 767px)').matches;
      const AMP = isMobile ? 20 : 40;          // px

      // Geser kiri/kanan linear: (t - 0.5)*2 => -1..1
      const base = (t - 0.5) * 2;              // -1..1

      items.forEach((img, i) => {
        const dir = (i % 2 === 0) ? 1 : -1;    // selang-seling arah
        const offset = dir * base * AMP;
        img.style.transform = `translateX(${offset}px)`;
        img.style.willChange = 'transform';
      });
    }

    // Inisialisasi & listeners
    update();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
  })();
    </script>
